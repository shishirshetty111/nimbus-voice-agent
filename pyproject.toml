# Vercel reads dependencies from here when this file exists. Keep the list identical to
# requirements.txt (which local installs use; see the README).

[project]
name = "nimbus-voice-agent"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "websockets==16.1.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "faiss-cpu==1.15.1",
    "fastembed==0.8.1",
    "onnxruntime==1.30.0",
    "umap-learn==0.5.12",
    "scikit-learn==1.9.1",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "pynndescent==0.6.0",
    "tiktoken==0.14.0",
    "openai==3.24.0",
    "anthropic==1.11.0",
    "google-genai==2.28.0",
]

[tool.vercel.fastapi.static]
# Serve the /assets and /data mounts from Vercel's CDN, even though the app has top-level middleware
# (it only sets cache headers). Without this every script and stylesheet is a function call: one page
# load used to start nine cold server instances, each warming up for half a minute.
cdn = true
